<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Doof DOM counter</title>
    <style>
      :root { font-family: system-ui, sans-serif; color-scheme: light dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      .app { width: min(38rem, calc(100% - 2rem)); display: grid; gap: 1rem; }
      .count { font-size: 2rem; font-weight: 700; }
      .controls { display: flex; flex-wrap: wrap; gap: .75rem; }
      button { padding: .65rem .9rem; font: inherit; }
      #movable, #replacement { padding: 1rem; border: 1px solid currentColor; }
    </style>
  </head>
  <body>
    <script type="module" src="./main.js"></script>
